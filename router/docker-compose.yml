version: '3.9'

services:
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: always
    ports:
      - "9411:9411"
    networks:
      - moonspace-network

  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - $PWD/../composer/storage/mongo:/data/db
    networks:
      - moonspace-network

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    command: redis-server --requirepass root
    ports:
      - "6379:6379"
    networks:
      - moonspace-network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: always
    environment:
      DB_VENDOR: h2
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - moonspace-network
    volumes:
      - ./docker/composer/keycloak/ssl.sh:/init.sh
    ports:
      - "8095:8080"
    entrypoint: [ "/opt/keycloak/bin/kc.sh", "start-dev" ]

  consul:
    container_name: consul
    image: hashicorp/consul:latest
    restart: always
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "vault-plaintext-root-token"
      CONSUL_HTTP_ADDR: "consul:8500"
      CONSUL_HTTP_TOKEN: "e95b599e-166e-7d80-08ad-aee76e7ddf19"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./docker/consul/server.json:/consul/config/server.json
    networks:
      - moonspace-network
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    command: "agent"

  vault:
    container_name: vault
    image: hashicorp/vault:1.8.1
    hostname: vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_API_ADDR: "http://vault:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "vault-plaintext-root-token"
      CONSUL_HTTP_ADDR: "consul:8500"
      CONSUL_HTTP_TOKEN: "e95b599e-166e-7d80-08ad-aee76e7ddf19"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./docker/vault/policy.json:/vault/policies/policy.json
    networks:
      - moonspace-network

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:latest
    restart: always
    networks:
      - moonspace-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:latest
    restart: always
    networks:
      - moonspace-network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    container_name: kafka-ui
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "9991:8080"
    networks:
      - moonspace-network
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
    depends_on:
      - kafka

  collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:0.97.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./docker/collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
    restart: always
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "8889" # Prometheus exporter metrics
    depends_on:
      - loki
      - jaeger
      - zipkin
      - tempo
    networks:
      - moonspace-network

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: always
    ports:
      - "16686:16686"
      - "4317"
    networks:
      - moonspace-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - collector
    networks:
      - moonspace-network

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
      - zipkin
      - tempo
    networks:
      - moonspace-network

  tempo:
    container_name: tempo
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yml
    restart: always
    ports:
      - "4317"  # otlp grpc
      - "3200"  # tempo as grafana datasource
    networks:
      - moonspace-network

  loki:
    container_name: loki
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    ports:
      - "3100"
    networks:
      - moonspace-network

  connector:
    build: ./
    container_name: connector
    environment:
      OTEL_SERVICE_NAME: "connector"
      OTEL_RESOURCE_ATTRIBUTES: "service=connector,env=dev"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      MONGODB_HOST: "mongodb"
      REDIS_HOST: "redis"
      KAFKA_SERVER: "kafka:29092"
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
      - redis
      - kafka
      - collector
    networks:
      - moonspace-network

networks:
  moonspace-network: